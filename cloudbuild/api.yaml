options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "apps/api/Dockerfile"
      - "-t"
      - "asia-south1-docker.pkg.dev/${PROJECT_ID}/appforge/appforge-api:${SHORT_SHA}"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-south1-docker.pkg.dev/${PROJECT_ID}/appforge/appforge-api:${SHORT_SHA}"
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |-
        gcloud run deploy appforge-api \
          --image=asia-south1-docker.pkg.dev/${PROJECT_ID}/appforge/appforge-api:${SHORT_SHA} \
          --region=asia-south1 --allow-unauthenticated \
          --memory=512Mi --cpu=1 --min-instances=0 \
          --set-secrets=OPENROUTER_API_KEY=openrouter_api_key:latest,CLERK_SECRET_KEY=clerk_secret_key:latest,DATABASE_URL=neon_database_url:latest
images:
  - "asia-south1-docker.pkg.dev/${PROJECT_ID}/appforge/appforge-api:${SHORT_SHA}"