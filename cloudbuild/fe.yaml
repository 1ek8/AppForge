substitutions:
  _VITE_BACKEND_URL: https://appforge-api.byaniket.site
  _VITE_CLERK_PUBLISHABLE_KEY: pk_test_cG9ldGljLWdvYmJsZXItNjQ3My5jbGVyay5hY2NvdW50cy5kZXYk
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "apps/fe/Dockerfile"
      - "--build-arg"
      - "VITE_BACKEND_URL=${_VITE_BACKEND_URL}"
      - "--build-arg"
      - "VITE_CLERK_PUBLISHABLE_KEY=${_VITE_CLERK_PUBLISHABLE_KEY}"
      - "-t"
      - "asia-south1-docker.pkg.dev/${PROJECT_ID}/appforge/appforge-fe:${SHORT_SHA}"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-south1-docker.pkg.dev/${PROJECT_ID}/appforge/appforge-fe:${SHORT_SHA}"
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |-
        gcloud run deploy appforge-fe \
          --image=asia-south1-docker.pkg.dev/${PROJECT_ID}/appforge/appforge-fe:${SHORT_SHA} \
          --region=asia-south1 --allow-unauthenticated \
          --memory=256Mi --cpu=1 --min-instances=0
images:
  - "asia-south1-docker.pkg.dev/${PROJECT_ID}/appforge/appforge-fe:${SHORT_SHA}"